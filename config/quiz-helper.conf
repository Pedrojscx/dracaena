# quiz-helper: configuração
#
# Copiada para $XDG_CONFIG_HOME/quiz-helper/config na instalação (sem
# sobrescrever uma existente). Formato KEY=VALUE, uma por linha; aspas são
# opcionais; linhas começando com # são comentários. Distâncias em pixels
# são lógicos (as mesmas unidades do Hyprland), independentes da escala.

# ---------------------------------------------------------------- Claude
# Modelo passado para `claude -p --model`.
MODEL=sonnet
# Tempo máximo (s) de cada chamada ao Claude.
CLAUDE_TIMEOUT=45
# Caminho do executável `claude`. Vazio = descoberto pelo instalador/PATH.
CLAUDE_BIN=
# Argumentos extras para o claude (separados por espaço).
CLAUDE_EXTRA_ARGS=

# ---------------------------------------------------------------- navegador
# Regex (ERE) aplicada ao `class` da janela ativa (`hyprctl activewindow -j`).
BROWSER_CLASS_REGEX=^vivaldi

# ---------------------------------------------------------------- detecção da página
# A cada ciclo a janela inteira do Vivaldi é capturada e a interface do
# navegador (abas, endereço, painéis laterais) é descartada detectando suas
# bordas. Se a detecção errar, fixe as margens em pixels lógicos; "auto" detecta.
CHROME_TOP_PX=auto
CHROME_LEFT_PX=auto

# ---------------------------------------------------------------- localização
# Distância à esquerda do início do texto da alternativa onde clicar.
CLICK_OFFSET_X=40
# Similaridade mínima (0-1, difflib) para aceitar um texto localizado.
MATCH_THRESHOLD=0.6
# Confiança mínima do OCR (0-100) para aceitar a palavra "Submit".
OCR_MIN_CONF=60

# ---------------------------------------------------------------- ciclo
# 1 = clicar em Submit após responder; 0 = só marcar e avançar.
CLICK_SUBMIT=1
# Esperas em milissegundos.
SUBMIT_DELAY_MS=300
DROPDOWN_DELAY_MS=350
FEEDBACK_DELAY_MS=800
NEXT_DELAY_MS=800
STABLE_INTERVAL_MS=400
# Diferença máxima (pixels, `magick compare -metric AE`) entre duas capturas
# seguidas para considerar a tela estável.
STABLE_TOLERANCE_PX=50
# Segundos esperando a questão mudar depois de avançar.
ADVANCE_TIMEOUT=8
# Máximo de questões por execução do loop.
MAX_QUESTIONS=60
# Máximo de rolagens por busca (em cada direção).
MAX_SCROLLS=6
# "Cliques" da roda do mouse por rolagem (negativo rola para baixo no ydotool).
SCROLL_STEP=-3
# Se o cursor estiver mais longe que isso de onde o script o deixou, pausa.
MOUSE_ABORT_PX=30
# Associação: drag (arrastar) ou click (clicar na letra e depois no alvo).
MATCH_MODE=drag
# Passos intermediários do arrasto e pausa entre eles (ms).
DRAG_STEPS=12
DRAG_STEP_MS=15
# 1 = após feedback de erro, consultar o Claude de novo e refazer uma vez.
RETRY_ON_INCORRECT=1

# ---------------------------------------------------------------- textos
# Palavras que, junto de "submit" (ou sozinhas, como "Finish"), identificam o
# botão que encerra a avaliação inteira. Esse botão NUNCA é clicado.
SUBMIT_WORDS_BLOCKLIST="all,assessment,exam,finish,end"
# Frases de feedback do NetAcad (componentes Adapt: título "Correct",
# "Incorrect" ou "Partly correct" no popup/área de feedback).
FEEDBACK_CORRECT_WORDS="Correct,You answered correctly,That's correct,That is correct,Well done"
FEEDBACK_INCORRECT_WORDS="Incorrect,Partly correct,Partially correct,Not quite,That's not right,That is not right,Try again"
# Frases de tela final ou de resultado (o loop encerra sem clicar).
END_WORDS="Assessment Complete,Your score,You scored,Results,Exam Complete,Quiz Complete,Your result"
# Rótulos de botão para desfazer a atividade antes do retry.
RESET_WORDS="Reset,Try again,Retry"

# ---------------------------------------------------------------- notificações
# 1 = com o "não perturbe" do daemon ativo (swaync, mako ou dunst), envia as
# notificações do quiz-helper como críticas para elas aparecerem mesmo assim.
NOTIFY_OVER_DND=1

# ---------------------------------------------------------------- registro
# Dias de retenção das capturas em $XDG_DATA_HOME/quiz-helper/runs.
KEEP_DAYS=7
