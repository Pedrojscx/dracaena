# quiz-helper: configuração
#
# Copiada para $XDG_CONFIG_HOME/quiz-helper/config na instalação (sem
# sobrescrever uma existente). Formato KEY=VALUE, uma por linha; aspas são
# opcionais; linhas começando com # são comentários.

# ---------------------------------------------------------------- Claude
# Modelo passado para `claude -p --model`.
MODEL=haiku
# Modelo da SEGUNDA tentativa (resposta inválida ou feedback de erro da página).
# Vazio = usa o mesmo MODEL. Ex.: RETRY_MODEL=sonnet
RETRY_MODEL=
# Tempo máximo (s) de cada chamada ao Claude.
CLAUDE_TIMEOUT=45
# 1 = pedir a resposta com `claude --json-schema` (saída estruturada); 0 = texto livre
# com parser tolerante (padrão; compare com `quizhelper bench-schema`).
CLAUDE_SCHEMA=0
# Caminho do executável `claude`. Vazio = descoberto pelo instalador/PATH.
CLAUDE_BIN=
# Argumentos extras para o claude (separados por espaço).
CLAUDE_EXTRA_ARGS=

# ---------------------------------------------------------------- navegador
# Porta do Chrome DevTools Protocol do Vivaldi aberto pelo quiz-browser
# (sempre só em 127.0.0.1, perfil dedicado).
CDP_PORT=9222
# Executável do navegador usado pelo quiz-browser.
BROWSER_BIN=vivaldi-stable

# ---------------------------------------------------------------- ciclo
# 1 = clicar em Submit após marcar; 0 = só marcar e pausar.
CLICK_SUBMIT=1
# 1 = após feedback de erro (seção do curso), consultar o Claude de novo com o
# feedback, usar Reset/Try again e responder mais uma vez.
RETRY_ON_INCORRECT=1
# Esperas ativas (checagem a cada 100 ms; estes são os tetos), em ms.
ACTION_TIMEOUT_MS=3000
VERIFY_TIMEOUT_MS=1500
# Espera máxima pelo botão Submit existir e habilitar antes de pausar.
SUBMIT_TIMEOUT_MS=5000
FEEDBACK_TIMEOUT_MS=6000
ADVANCE_TIMEOUT_MS=8000
# Tempo máximo (ms) para a página estabilizar depois de perder o contexto do iframe.
RECOVER_TIMEOUT_MS=15000
# Máximo de questões por execução do loop.
MAX_QUESTIONS=80

# ---------------------------------------------------------------- textos
# Palavras que, junto de "submit" num botão, identificam o envio da avaliação
# inteira (nunca clicado). A guarda bloqueia também, por estrutura, a tela de
# envio (finalscreen-view), "Submit Page", "Submit My Assessment", Skip All e
# Skip Question, com qualquer configuração.
SUBMIT_WORDS_BLOCKLIST="all,assessment,exam,finish,end"
# Rótulos do botão que desfaz a atividade antes do retry.
RESET_WORDS="Reset,Try again,Retry"
# Frases de tela de resultado (o loop encerra sem clicar).
END_WORDS="Assessment Complete,Your score,You scored,Exam Complete,Quiz Complete,Your result"

# ---------------------------------------------------------------- notificações
# 1 = com o "não perturbe" do daemon ativo (swaync, mako ou dunst), envia as
# notificações do quiz-helper como críticas para elas aparecerem mesmo assim.
NOTIFY_OVER_DND=1

# ---------------------------------------------------------------- registro
# Dias de retenção dos registros em $XDG_DATA_HOME/quiz-helper/runs.
KEEP_DAYS=7
