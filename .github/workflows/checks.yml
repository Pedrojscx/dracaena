name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m playwright install --with-deps --only-shell chromium
      - name: Reject local files and common credential patterns
        run: python tests/check_publication.py --tracked
      - name: Run isolated DOM suite
        env:
          QH_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: tests/run.sh
