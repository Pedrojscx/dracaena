[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dracaena"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4,<5", "psutil>=6,<8", "pywin32>=306; sys_platform == 'win32'", "playwright==1.64.1", "windows-toasts>=1.3; sys_platform == 'win32'"]

[project.scripts]
dracaena = "dracaena.cli:main"

[tool.setuptools.packages.find]
where = ["lib"]
include = ["dracaena*"]
namespaces = true

[tool.setuptools.package-data]
"dracaena.platform.resources" = ["*.json"]
"dracaena.core.prompts" = ["*.txt"]
"dracaena.adapters" = ["*.js"]
