<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Lista de exercícios</title><style>body{font:16px sans-serif;margin:24px}.sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}[hidden]{display:none!important}label,[role=radio],[role=option],[role=checkbox]{display:block;margin:6px 0;padding:6px}[aria-checked=true],[aria-selected=true],[aria-pressed=true]{background:#cfc}button.grande{display:block;width:320px;padding:18px;margin:8px 0;font-size:18px}td,th{padding:6px 10px}</style></head><body>
