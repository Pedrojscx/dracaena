  <title id="t">DRACAENA</title>
  <desc id="d">Banner escuro em verde-floresta, construído sobre a razão áurea: à esquerda o símbolo de dezesseis folhas de espada de São Jorge, em tranças entrelaçadas em quadrado, cercado por anéis em progressão áurea; à direita o nome DRACAENA em marfim com contorno dourado, entre duas linhas douradas, dentro de uma moldura de cantos chanfrados.</desc>
