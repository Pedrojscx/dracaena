<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">DRACAENA</title>
  <desc id="d">Banner escuro em verde-floresta com o símbolo de quatro folhas de espada de São Jorge à esquerda, o nome DRACAENA em marfim com contorno dourado e a frase Leitura precisa. Ação exata., entre duas linhas douradas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030906"/>
      <stop offset="1" stop-color="#0a3a26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a7f3d0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="g" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#04261b"/>
      <stop offset="0.55" stop-color="#0b7a55"/>
      <stop offset="1" stop-color="#4fe0a8"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a24b" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#c9a24b"/>
      <stop offset="0.85" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#c9a24b" stop-opacity="0"/>
    </linearGradient>
    <g id="leaf">
      <path d="M-25 0 C-30 -95 -13 -170 0 -200 C13 -170 30 -95 25 0 Z" fill="url(#g)" stroke="#c9a24b" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M0 -8 L0 -178" stroke="#a7f3d0" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="215" cy="180" r="260" fill="url(#glow)"/>
  <g transform="translate(55 20) scale(0.63)">
    <rect x="24" y="24" width="464" height="464" rx="56" fill="#061a13" fill-opacity="0.85"/>
    <rect x="24" y="24" width="464" height="464" rx="56" fill="none" stroke="#c9a24b" stroke-opacity="0.7" stroke-width="3"/>
    <use href="#leaf" transform="translate(158 238) rotate(-3)"/>
    <use href="#leaf" transform="translate(354 234) rotate(2)"/>
    <use href="#leaf" transform="translate(158 470) rotate(2) scale(1 0.97)"/>
    <use href="#leaf" transform="translate(354 474) rotate(-4)"/>
  </g>
  <rect x="440" y="96" width="760" height="2" fill="url(#rule)"/>
  <text x="440" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#f4efe0" stroke="#c9a24b" stroke-width="1.2" letter-spacing="16">DRACAENA</text>
  <text x="442" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#cfe8d8" letter-spacing="2">Leitura precisa. Ação exata.</text>
  <rect x="440" y="266" width="760" height="2" fill="url(#rule)"/>
</svg>
