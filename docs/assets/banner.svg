<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">DRACAENA</title>
  <desc id="d">Banner escuro em verde-floresta, composto na proporção áurea: à esquerda o símbolo de quatro folhas de espada de São Jorge trançadas, à direita o nome DRACAENA em marfim com contorno dourado, entre duas linhas douradas finas.</desc>
