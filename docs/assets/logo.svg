  <title id="t">DRACAENA, símbolo</title>
  <desc id="d">Ícone do DRACAENA no padrão Apple: quadrado de cantos contínuos em degradê verde-esmeralda, com um lótus de folhas de espada de São Jorge em anéis de 13, 8, 5 e 3 folhas, em razão áurea, e um ponto dourado no centro.</desc>
