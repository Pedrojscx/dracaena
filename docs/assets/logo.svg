<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
  <title id="t">DRACAENA, símbolo</title>
  <desc id="d">Símbolo do DRACAENA: quatro folhas de espada de São Jorge em pé, trançadas em dois pares que se cruzam nos pontos áureos do comprimento, verde-esmeralda com borda dourada, dentro de um cartão de proporção áurea.</desc>
