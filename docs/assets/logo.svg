  <title id="t">DRACAENA, símbolo</title>
  <desc id="d">Símbolo do DRACAENA: quatro folhas de espada de São Jorge em pé, em duas colunas e duas linhas como um quatro de ouros, verde-esmeralda com borda dourada, dentro de uma moldura fina em forma de cartão.</desc>
