  <title id="t">DRACAENA, símbolo</title>
  <desc id="d">Símbolo do DRACAENA: mandala em forma de lótus feita de folhas de espada de São Jorge, em cinco anéis de 21, 13, 8, 5 e 3 folhas, com raios em razão áurea e uma coroa de 34 pontos dourados; verde-esmeralda com borda dourada e nervura clara.</desc>
